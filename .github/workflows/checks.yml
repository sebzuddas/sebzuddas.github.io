name: "Checks"
# Vercel builds and deploys every push to master by itself. This runs the
# tests alongside, and triggers the daily rebuild.
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  pull_request:

  # Rebuilds daily so new Substack posts and GitHub repos appear.
  schedule:
    - cron: "0 6 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test models
        run: npm test

      - name: Check the token rule
        run: npm run lint:tokens

      - name: Build site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the instrument budget
        run: npm run check:bundle

      - name: Acceptance tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  rebuild:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a Vercel deployment
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::error::Add the VERCEL_DEPLOY_HOOK secret to rebuild daily."; exit 1; fi
          curl -fsS -X POST "$HOOK"
